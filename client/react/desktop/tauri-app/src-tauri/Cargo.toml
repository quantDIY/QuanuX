[package]
name = "quanux_desktop"
version = "0.0.1"
edition = "2021"

[dependencies]
tauri = { version = "2.5.1", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# (optional) only if you use notifications in tray.rs
tauri-plugin-notification = "2.0.0"
async-nats = "0.46.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3.32"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[patch.crates-io]
glib = { path = "./patches/glib-0.18.5" }
