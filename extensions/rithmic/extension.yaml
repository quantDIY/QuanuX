name: "rithmic-feed"
display_name: "Rithmic Data Pump"
version: "0.0.1"
runtime: "go"
command: "main.go"
description: "High-performance market data connector for Rithmic R/API+ (Go)."
permissions:
  - "market.data.read"
  - "order.execute"
env:
  - "QUANUX_RITHMIC_USER"
  - "QUANUX_RITHMIC_PASS"
  - "QUANUX_RITHMIC_SYSTEM"
  - "QUANUX_RITHMIC_GATEWAY"
  - "QUANUX_RITHMIC_HOST"

config:
  - name: "system_name"
    display: "Broker / System Name"
    type: "select"
    default: "Rithmic Paper Trading"
    options:
      - "Rithmic Paper Trading"
      - "AMP"
      - "Topstep"
      - "Apex"
      - "Ironbeam"
      - "Phillips"
      - "Dorman"
      - "Leeloo"
      - "UProfit"
    env: "QUANUX_RITHMIC_SYSTEM"

  - name: "gateway"
    display: "Gateway Region"
    type: "select"
    default: "Chicago"
    options:
      - "Chicago"
      - "Europe"
      - "Asia"
    env: "QUANUX_RITHMIC_GATEWAY"
