name: "quanux-topstepx"
display_name: "TopstepX Interface"
version: "0.0.1"
runtime: "python"
command: "python src/interface.py"
permissions:
  - "market.data.read"
  - "account.read"
  - "trading.execute"
config:
  env:
    QUANUX_TOPSTEP__BASE_API_URL: "https://api.topstepx.com"
    QUANUX_TOPSTEP__USERNAME: "${QUANUX_TOPSTEP__USERNAME}"
    QUANUX_TOPSTEP__PASSWORD: "${QUANUX_TOPSTEP__PASSWORD}"
    QUANUX_TOPSTEP__API_KEY: "${QUANUX_TOPSTEP__API_KEY}"
