[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "quanuxctl"
version = "0.0.1"
description = "QuanuX Control CLI (scaffold)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.7",
  "nats-py>=2.6.0",
]

[project.scripts]
quanuxctl = "quanuxctl.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quanuxctl"]
