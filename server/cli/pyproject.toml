[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "quanuxctl"
version = "0.0.1"
description = "QuanuX CLI (scaffold)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quanuxctl = "quanuxctl.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quanuxctl"]
