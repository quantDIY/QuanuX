[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanuxctl"
version = "0.1.0"
description = "QuanuX Control (quanuxctl) Unified Developer CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
quanuxctl = "quanuxctl.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
