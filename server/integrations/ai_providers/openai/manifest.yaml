id: openai
name: OpenAI
kind: external
base_url: https://api.openai.com/v1
auth:
  mode: api_key
  env_keys:
    - OPENAI_API_KEY
capabilities:
  chat: true
  embeddings: true
  tools: true
  streaming: true
  json_output: preferred
models:
  chat: []
  embeddings: []
headers:
  default:
    # Authorization header will be injected at runtime by secrets broker.
    OpenAI-Organization: ""  # optional
rate_limits:
  policy: best_effort
  rpm: null
  tpm: null
notes: |
  Store OPENAI_API_KEY in the Secrets Broker (not in .env).
