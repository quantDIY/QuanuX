id: cohere
name: Cohere
kind: external
base_url: https://api.cohere.ai
auth:
  mode: api_key
  env_keys:
    - COHERE_API_KEY
capabilities:
  chat: true
  embeddings: true
  tools: true
  streaming: true
  json_output: supported
models:
  chat: []
  embeddings: []
headers:
  default: {}
rate_limits:
  policy: best_effort
  rpm: null
  tpm: null
notes: |
  Store COHERE_API_KEY via Secrets Broker.
