---
- name: Aleph Protocol - Play 1 The Vault Initialization (panopticon-vault)
  hosts: panopticon_vault
  become: true
  tasks:
    - name: Create MinIO system user
      user:
        name: minio-user
        system: true

    - name: Create MinIO data directory
      file:
        path: /data/minio
        state: directory
        owner: minio-user
        group: minio-user

    - name: Download Native MinIO Server Binary
      get_url:
        url: https://dl.min.io/server/minio/release/linux-amd64/minio
        dest: /usr/local/bin/minio
        mode: '0755'

    - name: Download Native MinIO Client (mc)
      get_url:
        url: https://dl.min.io/client/mc/release/linux-amd64/mc
        dest: /usr/local/bin/mc
        mode: '0755'

    - name: Configure MinIO Dynamic Secrets (Zero Plaintext Rule)
      copy:
        dest: /etc/default/minio
        content: |
          MINIO_ROOT_USER={{ minio_root_user }}
          MINIO_ROOT_PASSWORD={{ minio_root_password }}
          MINIO_VOLUMES="/data/minio"
          MINIO_OPTS="--address 0.0.0.0:9000 --console-address 0.0.0.0:9001"
          # HA Groundwork: Explicit Region for Active-Active cross-region replication
          MINIO_SITE_REGION="nyc3"
        mode: '0600'
        owner: minio-user

    - name: Create MinIO SystemD Service Wrapper
      copy:
        dest: /etc/systemd/system/minio.service
        content: |
          [Unit]
          Description=MinIO Object Storage Vault
          Documentation=https://min.io/docs/minio/linux/index.html
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=minio-user
          Group=minio-user
          EnvironmentFile=/etc/default/minio
          ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
          Restart=always
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target

    - name: Enable and restart MinIO Server
      systemd:
        name: minio
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Wait for local MinIO HTTP API readiness
      wait_for:
        port: 9000
        delay: 2
        timeout: 30

    - name: Remove stale MinIO CLI alias (Idempotency)
      command: "mc alias rm myminio"
      failed_when: false
      changed_when: false

    - name: Authenticate MinIO CLI (mc) to local daemon
      command: "mc alias set myminio http://127.0.0.1:9000 {{ minio_root_user }} {{ minio_root_password }} --api s3v4"
      retries: 5
      delay: 5
      register: result
      until: result.rc == 0

    - name: Provision the 'quanux-telemetry' bucket via API
      command: "mc mb myminio/quanux-telemetry --insecure"
      register: mb_result
      failed_when: mb_result.rc != 0 and 'Bucket already exists' not in mb_result.stderr and 'BucketAlreadyOwnedByYou' not in mb_result.stderr and 'already own it' not in mb_result.stderr
      changed_when: "mb_result.rc == 0"

    - name: Enable Bucket Versioning (Absolute HA/Active-Active Readiness)
      command: "mc version enable myminio/quanux-telemetry"

    - name: Define 7-Day ILM Hard-Delete Policy (Compute/Storage Conservation)
      command: "mc ilm add --expire-days 7 myminio/quanux-telemetry"
      register: ilm_result
      failed_when: ilm_result.rc != 0 and 'already exists' not in ilm_result.stderr
      changed_when: "ilm_result.rc == 0"


- name: Aleph Protocol - Play 2 The Forge Artifacts (panopticon-forge)
  hosts: panopticon_forge
  become: true
  tasks:
    - name: Download Native Vector Binary
      get_url:
        url: https://packages.timber.io/vector/0.38.0/vector-0.38.0-x86_64-unknown-linux-musl.tar.gz
        dest: /tmp/vector.tar.gz

    - name: Extract Vector Tarball natively bypassing `strip-components` syntax
      unarchive:
        src: /tmp/vector.tar.gz
        dest: /tmp
        remote_src: true

    - name: Transplant Vector Binary to System PATH
      command: mv /tmp/vector-x86_64-unknown-linux-musl/bin/vector /usr/local/bin/vector
      args:
        creates: /usr/local/bin/vector

    - name: Ensure Vector config directory exists
      file:
        path: /etc/vector
        state: directory

    - name: Configure Vector to scrape NATS and route to GreptimeDB
      copy:
        dest: /etc/vector/vector.toml
        content: |
          [sources.nats_metrics]
          type = "prometheus_scrape"
          endpoints = ["http://{{ hostvars[groups['panopticon_buffer'][0]]['internal_ip'] | default('10.10.10.5') }}:8222/metrics"]
          scrape_interval_secs = 5

          [sinks.greptimedb]
          type = "prometheus_remote_write"
          inputs = ["nats_metrics"]
          endpoint = "http://127.0.0.1:4000/v1/prometheus/write"

    - name: Create Vector SystemD Service Wrapper
      copy:
        dest: /etc/systemd/system/vector.service
        content: |
          [Unit]
          Description=Vector Ingestion Daemon
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/vector --config /etc/vector/vector.toml
          Restart=always
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target

    - name: Enable and restart Vector
      systemd:
        name: vector
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Download Native GreptimeDB Binary
      get_url:
        url: https://github.com/GreptimeTeam/greptimedb/releases/download/v0.8.0/greptime-linux-amd64-v0.8.0.tar.gz
        dest: /tmp/greptime.tar.gz

    - name: Extract GreptimeDB
      unarchive:
        src: /tmp/greptime.tar.gz
        dest: /usr/local/bin
        remote_src: true

    - name: Ensure GreptimeDB config directory exists
      file:
        path: /etc/greptimedb
        state: directory

    - name: Configure GreptimeDB to write to MinIO with Hive Partitioning
      copy:
        dest: /etc/greptimedb/config.toml
        content: |
          [storage]
          type = "S3"
          bucket = "quanux-telemetry"
          root = "/telemetry"
          endpoint = "http://{{ hostvars[groups['panopticon_vault'][0]]['internal_ip'] }}:9000"
          access_key_id = "{{ minio_root_user }}"
          secret_access_key = "{{ minio_root_password }}"
          region = "nyc3"

          # Enforce Hive Partitioning for DuckDB Oculus partition pruning
          [storage.manifest]
          partition_format = "year=%Y/month=%m/day=%d/hour=%H"

    - name: Create GreptimeDB SystemD Service Wrapper
      copy:
        dest: /etc/systemd/system/greptimedb.service
        content: |
          [Unit]
          Description=GreptimeDB Fast Ingestion Edge
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/greptime standalone start -c /etc/greptimedb/config.toml
          Restart=always
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target

    - name: Enable and restart GreptimeDB
      systemd:
        name: greptimedb
        daemon_reload: true
        enabled: true
        state: restarted

- name: Aleph Protocol - Play 3 The Ledger Audit (panopticon-ledger)
  hosts: panopticon_ledger
  become: true
  tasks:
    - name: Install dependencies for APT repositories
      apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Add OpenSearch GPG key
      apt_key:
        url: https://artifacts.opensearch.org/publickeys/opensearch.pgp
        state: present

    - name: Add OpenSearch APT repository
      apt_repository:
        repo: deb https://artifacts.opensearch.org/releases/bundle/opensearch/2.x/apt stable main
        state: present

    - name: Install Native OpenSearch (Forced Shell Environment to secure zxcvbn password)
      shell: "env OPENSEARCH_INITIAL_ADMIN_PASSWORD='{{ opensearch_admin_password }}' DEBIAN_FRONTEND=noninteractive apt-get install -y opensearch=2.19.4"
      args:
        executable: /bin/bash
        creates: /etc/opensearch/opensearch.yml

    - name: OpenSearch VPC Binding
      lineinfile:
        path: /etc/opensearch/opensearch.yml
        regexp: '^#?network\.host:'
        line: "network.host: {{ hostvars[inventory_hostname]['internal_ip'] | default('10.10.10.6') }}"

    - name: Configure OpenSearch single-node discovery
      lineinfile:
        path: /etc/opensearch/opensearch.yml
        regexp: '^#?discovery\.type:'
        line: "discovery.type: single-node"

    - name: Disable OpenSearch Security strictly on internal VPC
      lineinfile:
        path: /etc/opensearch/opensearch.yml
        regexp: '^#?plugins\.security\.disabled:'
        line: "plugins.security.disabled: true"

    - name: Strict Fencing - Accept OpenSearch traffic only from Forge & Nexus IPs
      ufw:
        rule: allow
        proto: tcp
        port: '9200'
        src: "{{ item }}"
      with_items:
        - "{{ hostvars[groups['panopticon_forge'][0]]['internal_ip'] }}"
        - "{{ hostvars[groups['panopticon_nexus'][0]]['internal_ip'] }}"

    - name: Enable and restart OpenSearch service
      systemd:
        name: opensearch
        enabled: true
        state: restarted


- name: Aleph Protocol - Play 4 The Oracle Compilation (panopticon-oracle)
  hosts: panopticon_oracle
  become: true
  tasks:
    - name: Download Native DuckDB Binary
      get_url:
        url: https://github.com/duckdb/duckdb/releases/download/v0.10.0/duckdb_cli-linux-amd64.zip
        dest: /tmp/duckdb_cli.zip

    - name: Ensure Unzip is installed
      apt:
        name: unzip
        state: present
        update_cache: true

    - name: Extract DuckDB
      unarchive:
        src: /tmp/duckdb_cli.zip
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'

    - name: Ensure DuckDB Oculus config directory exists
      file:
        path: /etc/duckdb
        state: directory

    - name: Generate DuckDB Initialization Script (httpfs / Hive Partitioning)
      copy:
        dest: /etc/duckdb/init.sql
        content: |
          INSTALL httpfs;
          LOAD httpfs;

          SET s3_region='nyc3';
          SET s3_endpoint='{{ hostvars[groups['panopticon_vault'][0]]['internal_ip'] }}:9000';
          SET s3_access_key_id='{{ minio_root_user }}';
          SET s3_secret_access_key='{{ minio_root_password }}';
          SET s3_use_ssl=false;

          -- Force Byte-Range Requests and Hive Partition Pruning against the Vault
          CREATE VIEW IF NOT EXISTS quanux_telemetry_live AS
          SELECT * FROM read_parquet('s3://quanux-telemetry/telemetry/*/*/*/*/*.parquet', hive_partitioning=1);

    - name: Install Native PostgreSQL Database
      apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: true

    - name: Configure PostgreSQL Network Bindings
      shell: |
        for conf in /etc/postgresql/*/main/postgresql.conf; do
          sed -i "s/^#\?listen_addresses.*/listen_addresses = '*'/g" "$conf"
        done

    - name: Configure PostgreSQL VPC Subnet Trust
      shell: |
        for hba in /etc/postgresql/*/main/pg_hba.conf; do
          if ! grep -q "0.0.0.0/0 trust" "$hba"; then
            echo "host all all 0.0.0.0/0 trust" >> "$hba"
          fi
        done

    - name: Enable and restart PostgreSQL
      systemd:
        name: postgresql
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Hydrate QuanuX Database and Users
      become: true
      become_user: postgres
      shell: |
        psql -tc "SELECT 1 FROM pg_database WHERE datname = 'quanux'" | grep -q 1 || psql -c "CREATE DATABASE quanux;"
        psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"

    - name: Execute Extension Protocol
      become: true
      become_user: postgres
      shell: psql -d quanux -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

- name: Aleph Protocol - Play 5 The Nexus & AI Bridge (panopticon-nexus)
  hosts: panopticon_nexus
  become: true
  tasks:
    - name: Install Docker daemon natively and start the service
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker daemon is enabled and started
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Pull the Hasura GraphQL Docker image explicitly
      command: docker pull hasura/graphql-engine:v2.37.0

    - name: Ensure Nexus directory exists
      file:
        path: /opt/quanux/nexus
        state: directory

    - name: Generate Hasura GraphQL Engine Docker Compose
      copy:
        dest: /opt/quanux/nexus/docker-compose.yml
        content: |
          services:
            graphql-engine:
              image: hasura/graphql-engine:v2.37.0
              network_mode: "host"
              environment:
                HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
                HASURA_GRAPHQL_DEV_MODE: "true"
                HASURA_GRAPHQL_ADMIN_SECRET: "${QUANUX_HASURA_SECRET}"
                # The Supergraph mappings to the decoupled matrix:
                HASURA_GRAPHQL_DATABASE_URL: "postgresql://postgres:postgres@{{ hostvars[groups['panopticon_oracle'][0]]['internal_ip'] }}:5432/quanux"
                QUANUX_ORACLE_URL: "postgresql://postgres:postgres@{{ hostvars[groups['panopticon_oracle'][0]]['internal_ip'] }}:5432/quanux"
                QUANUX_LEDGER_URL: "http://{{ hostvars[groups['panopticon_ledger'][0]]['internal_ip'] }}:9200"
              restart: always

    - name: Execute docker compose up -d with dynamic vault secrets
      command: docker compose up -d
      args:
        chdir: /opt/quanux/nexus
      environment:
        QUANUX_HASURA_SECRET: "{{ hasura_admin_secret }}"

    - name: Create Python VENV for FastMCP Bridge
      command: python3 -m venv /opt/quanux/mcp_env
      args:
        creates: /opt/quanux/mcp_env/bin/activate

    - name: Pip install setuptools, Cython, fastmcp via explicit VENV binary
      shell: /opt/quanux/mcp_env/bin/pip install --upgrade setuptools Cython fastmcp

    - name: Transplant FastMCP Bridge Source Core (Cython & Python)
      copy:
        src: "/Users/Duncan/Antigravity/QuanuX/QuanuX/QuanuX-Observability/python/mcp_bridge/{{ item }}"
        dest: "/opt/quanux/nexus/{{ item }}"
      loop:
        - mcp_server.py
        - telemetry_compiler.pyx
        - setup_compiler.py

    - name: Compile the telemetry_compiler.pyx translation bridge
      command: /opt/quanux/mcp_env/bin/python setup_compiler.py build_ext --inplace
      args:
        chdir: /opt/quanux/nexus
        creates: /opt/quanux/nexus/telemetry_compiler.c

    - name: Create FastMCP SystemD Service Wrapper
      copy:
        dest: /etc/systemd/system/quanux-mcp.service
        content: |
          [Unit]
          Description=QuanuX FastMCP Bridge (Cython Native)
          After=docker.service network-online.target

          [Service]
          WorkingDirectory=/opt/quanux/nexus
          Environment="QUANUX_HASURA_URL=http://{{ hostvars[groups['panopticon_nexus'][0]]['internal_ip'] }}:8080/v1/graphql"
          ExecStart=/opt/quanux/mcp_env/bin/python -m mcp_server
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start the quanux-mcp service natively
      systemd:
        name: quanux-mcp
        daemon_reload: true
        enabled: true
        state: restarted
