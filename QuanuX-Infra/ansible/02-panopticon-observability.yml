---
- name: Panopticon Genesis - Install Observability Stack (OpenSearch Ledger)
  hosts: panopticon_ledger
  become: true
  tasks:
    - name: Increase vm.max_map_count for OpenSearch requirement
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: true

    - name: Install dependencies for APT repositories
      apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Add OpenSearch GPG key
      apt_key:
        url: https://artifacts.opensearch.org/publickeys/opensearch.pgp
        state: present

    - name: Add OpenSearch APT repository
      apt_repository:
        repo: deb https://artifacts.opensearch.org/releases/bundle/opensearch/2.x/apt stable main
        state: present

    - name: Install Native OpenSearch
      apt:
        name:
          - opensearch
        state: present
        update_cache: true
      environment:
        OPENSEARCH_INITIAL_ADMIN_PASSWORD: "QuanuxMasterPassword123!"

    - name: Configure OpenSearch network host
      lineinfile:
        path: /etc/opensearch/opensearch.yml
        regexp: '^#?network\.host:'
        line: "network.host: {{ hostvars[inventory_hostname]['internal_ip'] | default('10.10.10.4') }}"

    - name: Configure OpenSearch single-node discovery
      lineinfile:
        path: /etc/opensearch/opensearch.yml
        regexp: '^#?discovery\.type:'
        line: "discovery.type: single-node"

    - name: Disable OpenSearch security plugin internally
      lineinfile:
        path: /etc/opensearch/opensearch.yml
        regexp: '^#?plugins\.security\.disabled:'
        line: "plugins.security.disabled: true"

    - name: Enable and restart OpenSearch service
      systemd:
        name: opensearch
        enabled: true
        state: restarted

- name: Panopticon Genesis - Install Observability Stack (ValKey Buffer & Python Shadow)
  hosts: panopticon_buffer
  become: true
  tasks:
    - name: Install dependencies for APT repositories
      apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Install Native ValKey
      apt:
        name:
          - valkey-server
        state: present
        update_cache: true

    - name: Configure ValKey network bind
      lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^bind '
        line: "bind 127.0.0.1 {{ hostvars[inventory_hostname]['internal_ip'] | default('10.10.10.4') }}"

    - name: Enable and restart ValKey service
      systemd:
        name: valkey-server
        enabled: true
        state: restarted

    - name: Install Python 3 VENV and PIP natively
      apt:
        name:
          - python3-venv
          - python3-pip
        state: present
        update_cache: true

    - name: Ensure QuanuX base directory exists for Shadow Node
      file:
        path: /opt/quanux
        state: directory
        mode: '0755'

    - name: Create Python Shadow Node Virtual Environment
      command: python3 -m venv /opt/quanux/shadow_env
      args:
        creates: /opt/quanux/shadow_env/bin/activate

    - name: Install Observability Python packages
      pip:
        name:
          - opensearch-py
          - nats-py
          - valkey
        virtualenv: /opt/quanux/shadow_env
        virtualenv_command: /usr/bin/python3 -m venv
