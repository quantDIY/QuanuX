# QuanuX Suite Manifest (v0.0.1)
# Master source of truth for build targets, dependencies, and version matrix.

suite_version: 0.0.1
maintainer: "quantDIY"
generated: "2025-10-25T00:00:00Z"

components:
  - server
  - client
  - suite

targets:
  linux_x86_64:
    os: "Ubuntu LTS / Debian"
    flavors: ["Desktop", "Server"]
  nvidia_dgx_x86_64:
    os: "DGX OS"
    flavors: ["Server", "Suite"]
  nvidia_dgx_arm64:
    os: "DGX OS (ARM64 Spark)"
    flavors: ["Server", "Suite"]
  macos_universal:
    os: "macOS 13+"
    flavors: ["Client"]
  windows_11:
    os: "Windows 11"
    flavors: ["Client"]

dependencies:
  python: ">=3.11"
  node: ">=20"
  rust: "stable"
  redis: "latest"
  docker: "latest"
  conda_channels: ["conda-forge", "defaults"]

integrations:
  brokers: placeholder
  ai_providers: placeholder
  charting: placeholder

notes: |
  The QuanuX Suite manifest defines how client, server, and the combined suite
  are built for each OS/arch target. This will drive `quanuxctl build`.
